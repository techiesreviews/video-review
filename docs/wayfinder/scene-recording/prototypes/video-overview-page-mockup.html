<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video overview page mockup</title>
<style>
  /* PROTOTYPE, throwaway: the per-video overview page. Sample data only. */
  :root {
    --bg: oklch(16% 0.06 282); --panel: oklch(24% 0.066 282); --panel-2: oklch(27% 0.069 282);
    --border: oklch(30% 0.06 282); --chip: oklch(33% 0.096 282); --text: oklch(97.5% 0.012 282);
    --muted: oklch(76.3% 0.027 282); --dim: oklch(64% 0.04 282);
    --accent: oklch(65% 0.227 32.3); --star: oklch(85% 0.15 85); --warn: oklch(80% 0.13 75);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 500 14px/1.4 system-ui, sans-serif; }
  .page { background: var(--bg); color: var(--text); border-radius: 14px; padding: 18px; }
  h1 { font: 700 20px/1.2 system-ui; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .sub b { color: var(--text); }
  .cut { display: flex; gap: 3px; height: 34px; margin: 0 0 4px; }
  .cut div { display: grid; place-items: center; background: var(--chip); border-radius: 6px; font: 700 12px/1 system-ui; color: var(--text); min-width: 18px; overflow: hidden; }
  .cut div.none { background: transparent; box-shadow: inset 0 0 0 1px var(--border); color: var(--dim); }
  .cutlabel { color: var(--dim); font-size: 12px; margin: 0 0 16px; }
  .scene { background: var(--panel); border-radius: 12px; padding: 12px 12px 12px; margin: 0 0 10px; }
  .sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 0 0 10px; }
  .sh b { font: 700 15px/1.2 system-ui; }
  .sh .n { color: var(--dim); font: 700 13px/1 ui-monospace, monospace; }
  .chip { font: 600 11px/1 system-ui; padding: 4px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); }
  .chip.warn { background: oklch(30% 0.07 75); color: var(--warn); }
  .takes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .take { flex: 0 0 150px; background: var(--bg); border: 0; border-radius: 10px; padding: 6px; text-align: left; color: inherit; cursor: pointer; font: inherit; position: relative; }
  .take:hover { background: oklch(19% 0.06 282); }
  .take[aria-current="true"] { box-shadow: 0 0 0 2px #fff; }
  .thumb { height: 66px; border-radius: 7px; background: linear-gradient(135deg, oklch(30% 0.09 282), oklch(22% 0.07 282)); display: grid; place-items: center; font-size: 18px; color: var(--muted); position: relative; overflow: hidden; }
  .wave { position: absolute; inset: auto 6px 5px 6px; height: 14px; display: flex; gap: 2px; align-items: end; }
  .wave i { flex: 1; background: oklch(55% 0.09 282 / .7); border-radius: 1px; }
  .tl { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 0; font: 600 12px/1 system-ui; }
  .tl span:last-child { color: var(--muted); font-weight: 500; }
  .note { margin: 4px 2px 0; color: var(--dim); font-size: 11px; min-height: 1.3em; }
  .st { position: absolute; top: 9px; right: 10px; border: 0; background: oklch(16% 0.06 282 / .7); border-radius: 6px; width: 26px; height: 26px; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; }
  .st[data-on="true"] { color: var(--star); }
  .st:hover { background: var(--bg); }
  .pick { position: absolute; top: 9px; left: 10px; font: 700 11px/1 system-ui; color: var(--muted); background: oklch(16% 0.06 282 / .7); border-radius: 6px; padding: 5px 6px; }
  .empty { color: var(--dim); font-size: 13px; padding: 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--border); }
  .legend { color: var(--dim); font-size: 12px; margin: 10px 2px 0; }
  .legend b { color: var(--star); }
  .player { background: var(--panel); border-radius: 12px; padding: 12px; margin: 0 0 14px; display: flex; gap: 14px; align-items: center; }
  .screen { width: 168px; height: 94px; border-radius: 8px; background: linear-gradient(135deg, oklch(30% 0.09 282), oklch(20% 0.06 282)); display: grid; place-items: center; font-size: 28px; flex: none; }
  .player .t { font: 700 15px/1.3 system-ui; } .player .d { color: var(--muted); font-size: 13px; }
  .btn { margin-top: 8px; border: 0; background: var(--chip); color: var(--text); padding: 8px 12px; border-radius: 9px; font: 600 13px/1 system-ui; cursor: pointer; }
  @media (max-width: 520px) { .player { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="page">
  <h1>Weekly update 03 · overview</h1>
  <p class="sub" id="sub"></p>
  <div class="cut" id="cut" aria-label="Rough cut order"></div>
  <p class="cutlabel">Rough cut: the starred take of every scene, in script order.</p>

  <div class="player" id="player">
    <div class="screen">▶</div>
    <div><div class="t" id="pt"></div><div class="d" id="pd"></div><button class="btn" type="button" id="open">Open in review page</button></div>
  </div>

  <div id="scenes"></div>
  <p class="legend"><b>★</b> in the rough cut (your choice, or the newest by default) &nbsp; ☆ computer's favorite, when it differs. Click a take to play it, click its star to put it in the rough cut.</p>
</div>

<script>
(() => {
  // sample data: [take length in seconds, note]
  const scenes = [
    { n: 1, title: 'Hook', takes: [[38, ''], [41, '']], pick: 2, chosen: 2 },
    { n: 2, title: 'What it really costs', takes: [[74, 'ended early'], [92, 'long pause at 0:41'], [88, 'clean end']], pick: 3, chosen: 3, changed: true },
    { n: 3, title: 'The fix', takes: [[121, 'clean end'], [117, 'clean end']], pick: 1, chosen: 2 },
    { n: 4, title: 'Demo on the practice site', takes: [[203, 'long pause at 1:12']], pick: 1, chosen: 1 },
    { n: 5, title: 'What to do first', takes: [], pick: 0, chosen: 0 },
  ];
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const $ = q => document.querySelector(q);
  let cur = { s: 2, t: 3 };
  function bars(seed) { let x = seed * 9301 + 49297, o = ''; for (let i = 0; i < 24; i++) { x = (x * 9301 + 49297) % 233280; o += `<i style="height:${20 + (x / 233280) * 80}%"></i>`; } return o; }
  function render() {
    let total = 0, tk = 0, rec = 0;
    $('#cut').innerHTML = scenes.map(s => { const c = s.chosen; tk += s.takes.length; if (c) { rec++; const d = s.takes[c - 1][0]; total += d; return `<div style="flex:${d}" title="Scene ${s.n}, take ${c}">${s.n}</div>`; } return `<div class="none" style="flex:30">${s.n}</div>`; }).join('');
    $('#sub').innerHTML = `<b>${rec} of ${scenes.length} scenes</b> recorded · ${tk} takes · rough cut <b>${fmt(total)}</b>`;
    $('#scenes').innerHTML = scenes.map((s, si) => `
      <section class="scene"><div class="sh"><span class="n">${String(s.n).padStart(2, '0')}</span><b>${s.title}</b>
        ${s.changed ? '<span class="chip warn">Script changed since recording</span>' : ''}
        ${!s.takes.length ? '<span class="chip">Not recorded yet</span>' : ''}</div>
        ${s.takes.length ? `<div class="takes">${s.takes.map((t, i) => `
          <div class="take" role="button" tabindex="0" data-s="${si}" data-t="${i + 1}" aria-current="${cur.s === s.n && cur.t === i + 1}">
            <div class="thumb">▶<div class="wave">${bars(s.n * 10 + i)}</div></div>
            ${s.pick === i + 1 && s.chosen !== i + 1 ? '<span class="pick" title="Computer\'s favorite">☆ pick</span>' : ''}
            <button class="st" data-star="${si}:${i + 1}" data-on="${s.chosen === i + 1}" aria-label="Put in rough cut">${s.chosen === i + 1 ? '★' : '☆'}</button>
            <div class="tl"><span>Take ${i + 1}</span><span>${fmt(t[0])}</span></div>
            <div class="note">${t[1]}</div></div>`).join('')}</div>` : '<div class="empty">Record this scene in the Prompter and its takes show up here.</div>'}
      </section>`).join('');
    const s = scenes.find(x => x.n === cur.s), t = s.takes[cur.t - 1];
    $('#pt').textContent = `Scene ${s.n} · ${s.title} · take ${cur.t}`;
    $('#pd').textContent = `${fmt(t[0])}${t[1] ? ' · ' + t[1] : ''}${s.chosen === cur.t ? ' · in the rough cut' : ''}`;
  }
  document.addEventListener('click', e => {
    const st = e.target.closest('[data-star]');
    if (st) { const [si, t] = st.dataset.star.split(':').map(Number); scenes[si].chosen = t; cur = { s: scenes[si].n, t }; render(); return; }
    const tk = e.target.closest('.take');
    if (tk) { cur = { s: scenes[+tk.dataset.s].n, t: +tk.dataset.t }; render(); }
  });
  render();
})();
</script>
</body>
</html>
